<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Agon Probability Calculator</title>

    <link rel="stylesheet" href="style.css" />

    <script src="script.js" defer></script>
</head>

<body>
    <h1>
        Agon Probability Calculator
    </h1>

    <div>
        <span>Modes:</span>
        <label><input type="radio" id="top2-mode" name="mode" value="top2" checked>Top 2 + Divine Favor</label>
        <label><input type="radio" id="top1-mode" name="mode" value="top1">Top 1</label>
    </div>

    <br />

    <label>Target number: <input id="target" type="text" size="4" /></label>

    <div id="dice-selction">
        <p>
            Click to add die to calculation:
        </p>
        <div class="dice-row">
            <button class="dice-selector d4-button">
                d4
            </button>
            <button class="dice-selector d6-button">
                d6
            </button>
            <button class="dice-selector d8-button">
                d8
            </button>
            <button class="dice-selector d10-button">
                d10
            </button>
            <button class="dice-selector d12-button">
                d12
            </button>
        </div>
    </div>
    <p>
        Click to remove die from calculation:
    </p>
    <div id="dice-selections" class="dice-row"></div>

    <p id="result">Chance of success: 0.00%</p>

    <svg id="bar-graph"></svg>
</body>

</html>
